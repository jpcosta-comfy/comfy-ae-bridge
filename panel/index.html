<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Comfy AE Bridge</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; padding: 14px 14px 16px;
    background: #1a1a1a; color: #e6e6e6;
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  h1 { font-size: 13px; font-weight: 650; margin: 0 0 10px; letter-spacing: 0.01em; }
  h1 span { color: #f5a24a; }
  .row { display: flex; align-items: center; gap: 8px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #d4534a; flex: none; }
  #dot.on { background: #3cba6a; }
  #dot.warn { background: #e6a817; }
  #state { flex: 1; color: #cfcfcf; }
  #reload { background: none; border: 0; color: #8a8a8a; cursor: pointer; font-size: 14px; padding: 0 2px; }
  #reload:hover { color: #fff; }
  #project { margin: 8px 0 12px; color: #8d8d8d; word-break: break-all; min-height: 1.4em; }
  label { display: block; color: #9a9a9a; margin: 10px 0 4px; font-size: 11px; }
  input[type="text"] {
    width: 100%; background: #111; color: #eee; border: 1px solid #333;
    border-radius: 6px; padding: 7px 8px; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .modes { display: flex; gap: 6px; margin-top: 4px; }
  .modes button, .actions button, .ghost {
    border-radius: 6px; border: 1px solid #3a3a3a; background: #262626; color: #ddd;
    padding: 6px 8px; cursor: pointer; font: inherit;
  }
  .modes button.active { background: #f5a24a; color: #1a1a1a; border-color: #f5a24a; font-weight: 650; }
  .code {
    margin-top: 6px; padding: 10px 8px; background: #111; border-radius: 8px;
    text-align: center; font: 16px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.08em; user-select: all; cursor: pointer;
  }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .actions button { flex: 1; }
  .actions button.primary { background: #f5a24a; color: #1a1a1a; border-color: #f5a24a; font-weight: 650; }
  .hint { margin-top: 10px; color: #8a8a8a; }
  #local-note { display: none; margin-top: 8px; color: #bdbdbd; }
  #toast { margin-top: 8px; color: #3cba6a; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Comfy <span>AE Bridge</span></h1>
  <div class="row">
    <span id="dot"></span>
    <span id="state">connecting…</span>
    <button id="reload" title="Reload panel" type="button">⟳</button>
  </div>
  <div id="project"></div>

  <label>Connection</label>
  <div class="modes">
    <button type="button" id="mode-relay" class="active">Relay</button>
    <button type="button" id="mode-local">Local daemon</button>
  </div>

  <div id="relay-fields">
    <label for="relay">Relay websocket</label>
    <input id="relay" type="text" spellcheck="false" value="">
    <label>Pairing code</label>
    <div id="code" class="code" title="Click to copy the code"></div>
    <div class="actions">
      <button type="button" id="copy" class="primary">Copy connector URL</button>
      <button type="button" id="rotate" class="ghost">New code</button>
    </div>
  </div>
  <div id="local-note">
    This panel is dialing 127.0.0.1:9227. Point Claude Code at <code>node src/stdio.js</code> in this repo. No pairing code — the socket never leaves the machine.
  </div>
  <div id="toast"></div>
  <p class="hint" id="hint">Open this panel, copy the connector URL, then in Claude choose Settings → Connectors → Add custom connector and paste it.</p>

  <script src="config.js"></script>
  <script src="eval-call.js"></script>
  <script src="main.js"></script>
</body>
</html>
