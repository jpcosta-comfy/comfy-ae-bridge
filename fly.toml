# One-command deploy once `flyctl auth login` is done:
#   fly launch --copy-config --no-deploy   # first time, to claim the app name
#   fly deploy
#
# Keep a single machine. Panel sockets and MCP sessions live in memory.
# auto_stop is off so a quiet websocket is not killed between tool calls.

app = "comfy-ae-bridge"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
